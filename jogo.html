<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luanda Vice - Multiplayer</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
    }

    body {
      overflow: hidden;
      background: #000;
      width: 100vw;
      height: 100vh;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #87CEEB;
      overflow: hidden;
      transform-origin: center center;
    }

    /* Força modo paisagem se estiver no celular em pé */
    @media (orientation: portrait) {
      #game-container {
        width: 100vh;
        height: 100vw;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }

    /* Painel de Coordenadas (Afastado da borda) */
    #coords-panel {
      position: absolute;
      top: 40px;
      left: 40px;
      color: #0f0;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      z-index: 10;
      border: 1px solid rgba(0, 255, 0, 0.3);
      pointer-events: none;
      line-height: 1.4;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    /* Painel Online (Afastado da borda) */
    #online-panel {
      position: absolute;
      top: 40px;
      right: 40px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }

    /* Nome do Usuário */
    #username-tag {
      position: absolute;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      font-family: sans-serif;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
      z-index: 12;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      text-shadow: 1px 1px 2px black;
      display: none;
    }

    /* Área invisível para girar a câmera */
    #camera-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      z-index: 15; 
    }

    /* ----- JOYSTICK (Afastado da borda) ----- */
    #joystick-zone {
      position: absolute;
      bottom: 50px;
      left: 50px;
      width: 130px;
      height: 130px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      z-index: 20;
      backdrop-filter: blur(5px);
    }

    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* ----- ÁREA DE AÇÃO (Afastado da borda) ----- */
    #actions {
      position: absolute;
      bottom: 50px;
      right: 50px;
      width: 180px;
      height: 180px;
      z-index: 20;
    }

    .action-btn {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      cursor: pointer;
      transition: transform 0.1s;
      color: #fff;
      font-size: 30px;
    }

    .action-btn:active {
      transform: scale(0.9) !important;
    }

    #btn-punch {
      bottom: 0;
      right: 105px;
      width: 80px;
      height: 80px;
      background: rgba(255, 60, 60, 0.25);
      border: 2px solid #ff3c3c;
      box-shadow: 0 0 15px rgba(255, 60, 60, 0.4);
    }
    #btn-punch:active { background: rgba(255, 60, 60, 0.5); }

    #btn-jump {
      bottom: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: rgba(60, 255, 100, 0.25);
      border: 2px solid #3cff64;
      box-shadow: 0 0 15px rgba(60, 255, 100, 0.4);
      font-size: 34px;
    }
    #btn-jump:active { background: rgba(60, 255, 100, 0.5); }

    #btn-run {
      bottom: 95px;
      right: 55px;
      width: 70px;
      height: 70px;
      background: rgba(255, 200, 0, 0.25);
      border: 2px solid #ffcc00;
      box-shadow: 0 0 15px rgba(255, 200, 0, 0.4);
    }
    #btn-run:active, #btn-run.active {
      background: rgba(255, 200, 0, 0.6);
      transform: scale(0.9) !important;
    }
  </style>
</head>
<body>

  <div id="game-container">
    
    <div id="coords-panel">
      X: <span id="coord-x">0.00</span><br>
      Z: <span id="coord-z">0.00</span>
    </div>

    <div id="online-panel">
      Online: <span id="online-count">1</span>
    </div>

    <div id="username-tag">Jogador</div>

    <div id="camera-zone"></div>

    <div id="joystick-zone">
      <div id="joystick-stick"></div>
    </div>

    <div id="actions">
      <div id="btn-run" class="action-btn">⚡</div>
      <div id="btn-punch" class="action-btn">👊</div>
      <div id="btn-jump" class="action-btn">🦘</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    // ==========================================
    // CONFIGURAÇÃO FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDgSaXJZFNpiJW3DDXW5P_efRkeI0ef_so",
      authDomain: "luanda-vice.firebaseapp.com",
      projectId: "luanda-vice",
      storageBucket: "luanda-vice.firebasestorage.app",
      messagingSenderId: "446864906061",
      appId: "1:446864906061:web:634c5c1fc14c99d04ec904",
      databaseURL: "https://luanda-vice-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // ==========================================
    // VARIÁVEIS GLOBAIS
    // ==========================================
    let myUid = null;
    let myConfig = null;
    const container = document.getElementById('game-container');
    const usernameTag = document.getElementById('username-tag');
    const coordX = document.getElementById('coord-x');
    const coordZ = document.getElementById('coord-z');
    const onlineCountSpan = document.getElementById('online-count');

    let scene, camera, renderer;
    let otherPlayers = {}, nametags = {};
    let myPlayerModel, myHips, mySpine, myLegL, myLegR, myArmL, myArmR;

    const state = {
      isMoving: false,
      isRunning: false,
      isJumping: false,
      isPunching: false,
      punchTimer: 0,
      velocityY: 0,
      gravity: -25,
      walkSpeed: 5.5,
      runSpeed: 11.0,
      runTime: 0,
      moveDir: new THREE.Vector3(0, 0, 0),
      
      cameraAngleTarget: 0,
      cameraPitchTarget: 0.25,
      cameraAngleCurrent: 0,
      cameraPitchCurrent: 0.25,
      cameraDistCurrent: 6.0
    };

    const colliders = [];
    const cameraObstacles = [];
    let raycaster;

    function isScreenRotated() {
      return window.innerHeight > window.innerWidth;
    }

    // ==========================================
    // LOGIN E INICIALIZAÇÃO
    // ==========================================
    onAuthStateChanged(auth, (user) => {
      if (user) {
        myUid = user.uid;
        
        // Inicia o jogo e configura o Firebase
        initGame();
        setupMultiplayer();
      } else {
        window.location.href = 'index.html';
      }
    });

    function initGame() {
      let width = container.clientWidth;
      let height = container.clientHeight;

      // 1. CENA E CÂMERA
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog = new THREE.Fog(0x87CEEB, 100, 350); 

      camera = new THREE.PerspectiveCamera(65, width / height, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // 2. ILUMINAÇÃO
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffffee, 2.0);
      sunLight.position.set(100, 150, 100);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -150;
      sunLight.shadow.camera.right = 150;
      sunLight.shadow.camera.top = 150;
      sunLight.shadow.camera.bottom = -150;
      sunLight.shadow.camera.far = 400;
      scene.add(sunLight);

      // 3. MAPA COMPLETO COM TEXTURAS
      buildMap();

      // 4. MEU JOGADOR (Será criado com os dados do Firebase posteriormente)
      setupControls();
      raycaster = new THREE.Raycaster();
      
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1); 
        const t = clock.getElapsedTime();
        
        if (myPlayerModel) {
          updateMyPlayer(dt, t);
        }
        updateNametags(width, height);
        renderer.render(scene, camera);
      }
      animate();

      addEventListener('resize', () => {
        width = container.clientWidth;
        height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      });
    }

    // ==========================================
    // MULTIPLAYER (FIREBASE) - LÓGICA CORRIGIDA
    // ==========================================
    function setupMultiplayer() {
      const myPlayerRef = ref(db, 'players/' + myUid);
      onDisconnect(myPlayerRef).update({ isOnline: false });

      const playersRef = ref(db, 'players');
      
      // Escuta o Firebase (incluindo os meus próprios dados)
      onValue(playersRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        let onlineCount = 0;
        let myDataFromDB = null;

        // Conta e processa jogadores
        Object.keys(data).forEach(uid => {
          const pData = data[uid];
          if (pData.isOnline) onlineCount++;

          if (uid === myUid) {
            myDataFromDB = pData;
          } else if (pData.isOnline) {
            // Outros jogadores
            if (!otherPlayers[uid]) {
              const otherModel = createPlayerCharacter(pData);
              scene.add(otherModel);
              otherPlayers[uid] = {
                model: otherModel,
                data: pData,
                targetPos: new THREE.Vector3(pData.x, pData.y, pData.z),
                currentPos: new THREE.Vector3(pData.x, pData.y, pData.z),
                targetRot: pData.rotationY || 0,
                currentRot: pData.rotationY || 0,
                runTime: 0
              };
              
              // Cria a tag do outro jogador puxando o nick DIRETO do Firebase
              const tag = document.createElement('div');
              tag.className = 'nametag';
              tag.style.cssText = "position: absolute; color: white; background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.3); pointer-events: none; transform: translate(-50%, -50%); z-index: 12;";
              tag.innerText = pData.nick || "Jogador"; // Nome do banco!
              container.appendChild(tag);
              nametags[uid] = tag;

            } else {
              otherPlayers[uid].data = pData;
              otherPlayers[uid].targetPos.set(pData.x, pData.y, pData.z);
              otherPlayers[uid].targetRot = pData.rotationY || 0;
            }
          }
        });

        // Se o meu jogador ainda não foi criado (primeira leitura do banco)
        if (!myPlayerModel && myDataFromDB) {
          myConfig = myDataFromDB; // Pega os dados que o index.html salvou no banco
          
          myPlayerModel = createPlayerCharacter(myConfig);
          scene.add(myPlayerModel);
          
          myHips = myPlayerModel.userData.hips;
          mySpine = myPlayerModel.userData.spine;
          myLegL = myPlayerModel.userData.legL;
          myLegR = myPlayerModel.userData.legR;
          myArmL = myPlayerModel.userData.armL;
          myArmR = myPlayerModel.userData.armR;

          // Define o nome da minha tag pelo Firebase
          usernameTag.innerText = myConfig.nick || "Jogador";

          // Spawn
          let spawned = false;
          while (!spawned) {
            let testX = (Math.random() - 0.5) * 400;
            let testZ = (Math.random() - 0.5) * 400;
            let isSafe = true;
            const playerRadius = 1.0;
            for (let i = 0; i < colliders.length; i++) {
              const c = colliders[i];
              if (testX + playerRadius > c.x - c.halfWidth && testX - playerRadius < c.x + c.halfWidth && testZ + playerRadius > c.z - c.halfDepth && testZ - playerRadius < c.z + c.halfDepth) {
                isSafe = false; break;
              }
            }
            if (isSafe) { 
              myPlayerModel.position.set(testX, 0, testZ); 
              myPlayerModel.position.x = myDataFromDB.x || testX;
              myPlayerModel.position.z = myDataFromDB.z || testZ;
              spawned = true; 
            }
          }

          // Inicia o envio de posição
          setInterval(() => {
            update(myPlayerRef, {
              isOnline: true,
              x: myPlayerModel.position.x,
              y: myPlayerModel.position.y,
              z: myPlayerModel.position.z,
              rotationY: myPlayerModel.rotation.y,
              isMoving: state.isMoving,
              isRunning: state.isRunning,
              isPunching: state.isPunching
            });
          }, 100);
        }

        // Remove jogadores que saíram
        Object.keys(otherPlayers).forEach(uid => {
          if (!data[uid] || !data[uid].isOnline) {
            scene.remove(otherPlayers[uid].model);
            if (nametags[uid]) nametags[uid].remove();
            delete otherPlayers[uid];
            delete nametags[uid];
          }
        });

        onlineCountSpan.innerText = onlineCount;
      });

      function animateOthers(dt) {
        requestAnimationFrame(animateOthers);
        for (let uid in otherPlayers) {
          const p = otherPlayers[uid];
          const model = p.model;
          const data = p.data;

          p.currentPos.lerp(p.targetPos, 0.2);
          model.position.copy(p.currentPos);

          let diff = p.targetRot - p.currentRot;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.currentRot += diff * 0.2;
          model.rotation.y = p.currentRot;

          const legL = model.userData.legL;
          const legR = model.userData.legR;
          const armL = model.userData.armL;
          const armR = model.userData.armR;

          if (data.isMoving) {
            p.runTime += dt * (data.isRunning ? 15 : 10);
            const swing = Math.sin(p.runTime) * (data.isRunning ? 1.1 : 0.8);
            legL.rotation.x = swing;
            legR.rotation.x = -swing;
            armL.rotation.x = -swing;
            armR.rotation.x = swing;
          } else {
            legL.rotation.x = THREE.MathUtils.lerp(legL.rotation.x, 0, 0.15);
            legR.rotation.x = THREE.MathUtils.lerp(legR.rotation.x, 0, 0.15);
            armL.rotation.x = THREE.MathUtils.lerp(armL.rotation.x, 0, 0.15);
            armR.rotation.x = THREE.MathUtils.lerp(armR.rotation.x, 0, 0.15);
          }
        }
      }
      animateOthers(0.016);
    }

    // ==========================================
    // CONTROLES
    // ==========================================
    function setupControls() {
      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'arrowup') state.moveDir.z = -1;
        if (key === 's' || key === 'arrowdown') state.moveDir.z = 1;
        if (key === 'a' || key === 'arrowleft') state.moveDir.x = -1;
        if (key === 'd' || key === 'arrowright') state.moveDir.x = 1;
        if (key === 'shift') { state.isRunning = true; document.getElementById('btn-run').classList.add('active'); }
        if (key === ' ' && !state.isJumping) { state.isJumping = true; state.velocityY = 7.5; }
        if (key === 'f' && !state.isPunching) { state.isPunching = true; state.punchTimer = 0.35; }
        state.isMoving = true;
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w' || key === 'arrowup') state.moveDir.z = 0;
        if (key === 's' || key === 'arrowdown') state.moveDir.z = 0;
        if (key === 'a' || key === 'arrowleft') state.moveDir.x = 0;
        if (key === 'd' || key === 'arrowright') state.moveDir.x = 0;
        if (key === 'shift') { state.isRunning = false; document.getElementById('btn-run').classList.remove('active'); }
        
        if (state.moveDir.x === 0 && state.moveDir.z === 0 && !document.getElementById('joystick-zone').matches(':active')) {
          state.isMoving = false;
        }
      });

      const cameraZone = document.getElementById('camera-zone');
      let isDraggingCamera = false;
      let previousMousePosition = { x: 0, y: 0 };

      cameraZone.addEventListener('pointerdown', (e) => {
        isDraggingCamera = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
        cameraZone.setPointerCapture(e.pointerId);
      });

      cameraZone.addEventListener('pointermove', (e) => {
        if (!isDraggingCamera) return;
        
        let deltaX = e.clientX - previousMousePosition.x;
        let deltaY = e.clientY - previousMousePosition.y;
        
        if (isScreenRotated()) {
          const temp = deltaX;
          deltaX = deltaY; 
          deltaY = -temp;
        }
        
        state.cameraAngleTarget -= deltaX * 0.01;
        state.cameraPitchTarget += deltaY * 0.01; 
        state.cameraPitchTarget = Math.max(-0.3, Math.min(1.0, state.cameraPitchTarget));
        
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      cameraZone.addEventListener('pointerup', () => isDraggingCamera = false);
      cameraZone.addEventListener('pointercancel', () => isDraggingCamera = false);

      const zone = document.getElementById('joystick-zone');
      const stick = document.getElementById('joystick-stick');
      let joystickActive = false;
      let joystickCenter = { x: 0, y: 0 };

      zone.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        joystickActive = true;
        const rect = zone.getBoundingClientRect();
        joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        zone.setPointerCapture(e.pointerId);
      });

      zone.addEventListener('pointermove', (e) => {
        if (!joystickActive) return;
        e.preventDefault();
        
        let dx = e.clientX - joystickCenter.x;
        let dy = e.clientY - joystickCenter.y;
        
        if (isScreenRotated()) {
          const temp = dx;
          dx = dy; 
          dy = -temp;
        }
        
        const maxDist = 40;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxDist) {
          dx = (dx / dist) * maxDist;
          dy = (dy / dist) * maxDist;
        }
        
        stick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        
        state.moveDir.x = dx / maxDist;
        state.moveDir.z = dy / maxDist; 
        
        state.isMoving = (Math.abs(state.moveDir.x) > 0.1 || Math.abs(state.moveDir.z) > 0.1);
      });

      function resetJoystick() {
        joystickActive = false;
        stick.style.transform = `translate(-50%, -50%)`;
        state.moveDir.set(0, 0, 0);
        state.isMoving = false;
      }
      zone.addEventListener('pointerup', resetJoystick);
      zone.addEventListener('pointercancel', resetJoystick);

      document.getElementById('btn-jump').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!state.isJumping) { state.isJumping = true; state.velocityY = 7.5; }
      });

      document.getElementById('btn-punch').addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!state.isPunching) { state.isPunching = true; state.punchTimer = 0.35; }
      });

      const btnRun = document.getElementById('btn-run');
      btnRun.addEventListener('pointerdown', (e) => { e.preventDefault(); state.isRunning = true; btnRun.classList.add('active'); });
      btnRun.addEventListener('pointerup', (e) => { e.preventDefault(); state.isRunning = false; btnRun.classList.remove('active'); });
      btnRun.addEventListener('pointercancel', () => { state.isRunning = false; btnRun.classList.remove('active'); });
      btnRun.addEventListener('pointerleave', () => { state.isRunning = false; btnRun.classList.remove('active'); });
    }

    // ==========================================
    // ATUALIZAÇÃO DO JOGADOR
    // ==========================================
    function updateMyPlayer(dt, t) {
      coordX.innerText = myPlayerModel.position.x.toFixed(2);
      coordZ.innerText = myPlayerModel.position.z.toFixed(2);

      state.cameraAngleCurrent = THREE.MathUtils.lerp(state.cameraAngleCurrent, state.cameraAngleTarget, 0.1);
      state.cameraPitchCurrent = THREE.MathUtils.lerp(state.cameraPitchCurrent, state.cameraPitchTarget, 0.1);

      if (state.isJumping) {
        state.velocityY += state.gravity * dt;
        myPlayerModel.position.y += state.velocityY * dt;
        if (myPlayerModel.position.y <= 0) {
          myPlayerModel.position.y = 0;
          state.velocityY = 0;
          state.isJumping = false;
        }
      }

      if (state.isMoving) {
        const currentSpeed = state.isRunning ? state.runSpeed : state.walkSpeed;
        const animSpeed = state.isRunning ? 15 : 10;
        
        state.runTime += dt * animSpeed;
        
        const camForward = new THREE.Vector3(Math.sin(state.cameraAngleCurrent), 0, Math.cos(state.cameraAngleCurrent));
        const camRight = new THREE.Vector3(Math.cos(state.cameraAngleCurrent), 0, -Math.sin(state.cameraAngleCurrent));

        const moveVec = new THREE.Vector3();
        moveVec.addScaledVector(camForward, state.moveDir.z); 
        moveVec.addScaledVector(camRight, state.moveDir.x);
        
        if (moveVec.lengthSq() > 0) {
          moveVec.normalize();
          
          const nextX = myPlayerModel.position.x + moveVec.x * currentSpeed * dt;
          const nextZ = myPlayerModel.position.z + moveVec.z * currentSpeed * dt;

          let collide = false;
          for (let i = 0; i < colliders.length; i++) {
            const c = colliders[i];
            if (nextX + 0.5 > c.x - c.halfWidth && nextX - 0.5 < c.x + c.halfWidth && nextZ + 0.5 > c.z - c.halfDepth && nextZ - 0.5 < c.z + c.halfDepth) {
              collide = true; break;
            }
          }
          if (!collide) {
            myPlayerModel.position.x = nextX;
            myPlayerModel.position.z = nextZ;
          }
          
          const targetAngle = Math.atan2(moveVec.x, moveVec.z);
          myPlayerModel.rotation.y = THREE.MathUtils.lerp(myPlayerModel.rotation.y, targetAngle, 0.2);
        }

        const swingMultiplier = state.isRunning ? 1.1 : 0.8;
        const kneeMultiplier = state.isRunning ? 1.8 : 1.4;

        const swing = Math.sin(state.runTime) * swingMultiplier;
        const swingOpp = Math.sin(state.runTime + Math.PI) * swingMultiplier;

        myLegL.rotation.x = swing;
        myLegR.rotation.x = swingOpp;
        myLegL.userData.knee.rotation.x = Math.max(0, Math.sin(state.runTime - 1)) * kneeMultiplier;
        myLegR.userData.knee.rotation.x = Math.max(0, Math.sin(state.runTime - 1 + Math.PI)) * kneeMultiplier;

        myArmL.rotation.x = swingOpp;
        myArmR.rotation.x = swing;
        
        const bounceHeight = state.isRunning ? 0.1 : 0.06;
        myHips.position.y = 0.95 + Math.abs(Math.sin(state.runTime)) * bounceHeight;

      } else {
        state.runTime = 0;
        const lerp = 0.15;
        myLegL.rotation.x = THREE.MathUtils.lerp(myLegL.rotation.x, 0, lerp);
        myLegR.rotation.x = THREE.MathUtils.lerp(myLegR.rotation.x, 0, lerp);
        myLegL.userData.knee.rotation.x = THREE.MathUtils.lerp(myLegL.userData.knee.rotation.x, 0, lerp);
        myLegR.userData.knee.rotation.x = THREE.MathUtils.lerp(myLegR.userData.knee.rotation.x, 0, lerp);
        myArmL.rotation.x = THREE.MathUtils.lerp(myArmL.rotation.x, 0, lerp);
        myArmR.rotation.x = THREE.MathUtils.lerp(myArmR.rotation.x, 0, lerp);
        myHips.position.y = 0.95 + Math.sin(t * 2) * 0.01;
      }

      if (state.isPunching) {
        state.punchTimer -= dt;
        if (state.punchTimer > 0.2) {
          myArmR.rotation.x = THREE.MathUtils.lerp(myArmR.rotation.x, 0.5, 0.3);
        } else if (state.punchTimer > 0.05) {
          myArmR.rotation.x = THREE.MathUtils.lerp(myArmR.rotation.x, -1.8, 0.6);
          mySpine.rotation.x = THREE.MathUtils.lerp(mySpine.rotation.x, 0.2, 0.5);
        } else {
          myArmR.rotation.x = THREE.MathUtils.lerp(myArmR.rotation.x, 0, 0.2);
          mySpine.rotation.x = THREE.MathUtils.lerp(mySpine.rotation.x, 0, 0.2);
        }
        if (state.punchTimer <= 0) state.isPunching = false;
      } else {
        mySpine.rotation.x = THREE.MathUtils.lerp(mySpine.rotation.x, 0, 0.2);
      }

      const targetHeight = myPlayerModel.position.y + 1.5; 
      const targetDist = state.isRunning ? 6.8 : 6.0;
      state.cameraDistCurrent = THREE.MathUtils.lerp(state.cameraDistCurrent, targetDist, 0.05);

      const idealOffset = new THREE.Vector3(
        Math.sin(state.cameraAngleCurrent) * Math.cos(state.cameraPitchCurrent) * state.cameraDistCurrent,
        Math.sin(state.cameraPitchCurrent) * state.cameraDistCurrent + 1.5,
        Math.cos(state.cameraAngleCurrent) * Math.cos(state.cameraPitchCurrent) * state.cameraDistCurrent
      );
      
      const idealPosition = new THREE.Vector3(myPlayerModel.position.x, targetHeight, myPlayerModel.position.z).add(idealOffset);

      const rayDir = new THREE.Vector3().subVectors(idealPosition, myPlayerModel.position).normalize();
      raycaster.set(myPlayerModel.position.clone().add(new THREE.Vector3(0, 1.5, 0)), rayDir);
      
      const intersects = raycaster.intersectObjects(cameraObstacles, true);
      
      if (intersects.length > 0 && intersects[0].distance < state.cameraDistCurrent) {
        idealPosition.copy(myPlayerModel.position).add(rayDir.multiplyScalar(intersects[0].distance - 0.5));
        idealPosition.y += 1.5;
      }

      camera.position.lerp(idealPosition, 0.3); 
      camera.lookAt(myPlayerModel.position.x, targetHeight + 0.3, myPlayerModel.position.z);
    }

    // ==========================================
    // ATUALIZAÇÃO DAS NAMETAGS
    // ==========================================
    function updateNametags(width, height) {
      if (!myUid) return;
      const tempV = new THREE.Vector3();

      if (myPlayerModel && usernameTag) {
        tempV.copy(myPlayerModel.position); 
        tempV.y += 2.1; 
        tempV.project(camera);
        usernameTag.style.left = `${(tempV.x * 0.5 + 0.5) * width}px`;
        usernameTag.style.top = `${(-tempV.y * 0.5 + 0.5) * height}px`;
        usernameTag.style.display = tempV.z < 1 ? 'block' : 'none';
      }

      for (let uid in otherPlayers) {
        const p = otherPlayers[uid];
        const tag = nametags[uid];
        if (!tag) continue;
        tempV.copy(p.model.position); 
        tempV.y += 2.1; 
        tempV.project(camera);
        tag.style.left = `${(tempV.x * 0.5 + 0.5) * width}px`;
        tag.style.top = `${(-tempV.y * 0.5 + 0.5) * height}px`;
        tag.style.display = tempV.z < 1 ? 'block' : 'none';
      }
    }

    // ==========================================
    // CONSTRUÇÃO DO MAPA (MANTIDO DO SEU CÓDIGO)
    // ==========================================
    function buildMap() {
      function createGramaTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#3a5a30'; ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 10000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#4a7a40' : '#2a4a20';
          ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 3);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(50, 50); 
        return tex;
      }
      function createAsfaltoTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#222222'; ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 15000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#333333' : '#111111';
          ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
        }
        ctx.fillStyle = '#ffcc00'; ctx.fillRect(250, 0, 12, 512);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      function createTelhaTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#8a2211'; ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#5a1100'; ctx.lineWidth = 4;
        for(let y=0; y<256; y+=32) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
          for(let x=0; x<256; x+=32) { ctx.beginPath(); ctx.arc(x+16, y, 16, 0, Math.PI); ctx.stroke(); }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      function createTijoloTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#b06040'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#d0d0d0';
        for(let y=0; y<256; y+=32) {
          ctx.fillRect(0, y, 256, 4);
          for(let x=0; x<256; x+=64) {
            let offset = (y % 64 === 0) ? 0 : 32;
            ctx.fillRect(x + offset, y, 4, 32);
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      function createPredioTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4a5b6b'; ctx.fillRect(0, 0, 256, 512);
        for (let y = 10; y < 512; y += 64) {
          for (let x = 10; x < 256; x += 64) {
            if (Math.random() > 0.1) {
              const grad = ctx.createLinearGradient(x, y, x+50, y+50);
              grad.addColorStop(0, '#88ccff'); grad.addColorStop(1, '#336699');
              ctx.fillStyle = grad; ctx.fillRect(x, y, 44, 44);
              ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x+5, y+5, 10, 30);
            } else {
              ctx.fillStyle = '#111111'; ctx.fillRect(x, y, 44, 44);
            }
          }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      function createTroncoTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#4a3020'; ctx.fillRect(0, 0, 128, 256);
        ctx.strokeStyle = '#2a1505'; ctx.lineWidth = 2;
        for(let x=0; x<128; x+=8) {
          ctx.beginPath(); ctx.moveTo(x, 0);
          ctx.bezierCurveTo(x+10, 100, x-10, 150, x, 256); ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      const texGrama = createGramaTexture();
      const texAsfalto = createAsfaltoTexture();
      const texTelha = createTelhaTexture();
      const texTijolo = createTijoloTexture();
      const texPredio = createPredioTexture();
      const texTronco = createTroncoTexture();

      const matGround = new THREE.MeshStandardMaterial({ map: texGrama, roughness: 1.0 }); 
      const matRoad = new THREE.MeshStandardMaterial({ map: texAsfalto, roughness: 0.9 }); 
      const matCasaParede = new THREE.MeshStandardMaterial({ map: texTijolo, roughness: 0.8 });
      const matCasaTelhado = new THREE.MeshStandardMaterial({ map: texTelha, roughness: 0.7 });
      const matPredioComercial = new THREE.MeshStandardMaterial({ map: texPredio, roughness: 0.2, metalness: 0.5 });
      const matTronco = new THREE.MeshStandardMaterial({ map: texTronco, roughness: 0.9 });
      const matFolhas = new THREE.MeshStandardMaterial({ color: 0x1a4a1a, roughness: 0.8 });

      const world = new THREE.Group();
      scene.add(world);

      const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), matGround);
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      world.add(ground);

      function createRoad(x, z, width, length) {
        const road = new THREE.Mesh(new THREE.PlaneGeometry(width, length), matRoad);
        road.rotation.x = -Math.PI / 2;
        road.position.set(x, 0.02, z);
        road.receiveShadow = true;
        const texClone = texAsfalto.clone();
        texClone.needsUpdate = true;
        texClone.repeat.set(width / 20, length / 20);
        road.material = matRoad.clone();
        road.material.map = texClone;
        world.add(road);
      }
      createRoad(0, 0, 500, 16);
      createRoad(0, 0, 16, 500);

      function addCollider(x, z, w, d) { colliders.push({ x: x, z: z, halfWidth: w / 2, halfDepth: d / 2 }); }

      function createCommercialBuilding(x, z, width, depth, height) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        const bMat = matPredioComercial.clone();
        bMat.map = texPredio.clone();
        bMat.map.needsUpdate = true;
        bMat.map.repeat.set(width / 10, height / 20);
        const building = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bMat);
        building.position.y = height / 2;
        building.castShadow = true; building.receiveShadow = true;
        group.add(building);
        world.add(group);
        addCollider(x, z, width, depth);
        cameraObstacles.push(building);
      }

      function createHouse(x, z) {
        const group = new THREE.Group();
        group.position.set(x, 0, z);
        const width = 10, height = 6, depth = 12;
        const wMat = matCasaParede.clone();
        wMat.map = texTijolo.clone();
        wMat.map.needsUpdate = true;
        wMat.map.repeat.set(2, 1);
        const walls = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), wMat);
        walls.position.y = height / 2;
        walls.castShadow = true; walls.receiveShadow = true;
        group.add(walls);
        const roofGeo = new THREE.ConeGeometry(9, 4, 4);
        const roof = new THREE.Mesh(roofGeo, matCasaTelhado);
        roof.position.y = height + 2;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        group.add(roof);
        const door = new THREE.Mesh(new THREE.PlaneGeometry(2, 4), new THREE.MeshStandardMaterial({ color: 0x3a1a0a }));
        door.position.set(0, 2, depth / 2 + 0.01);
        group.add(door);
        world.add(group);
        addCollider(x, z, width, depth);
        cameraObstacles.push(walls);
      }

      function createPalmTree(x, z) {
        const tree = new THREE.Group();
        tree.position.set(x, 0, z);
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 6), matTronco);
        trunk.position.y = 3; trunk.castShadow = true;
        tree.add(trunk);
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(4, 2, 6), matFolhas);
        leaves.position.y = 6; leaves.castShadow = true;
        tree.add(leaves);
        world.add(tree);
        addCollider(x, z, 1.5, 1.5);
      }

      createCommercialBuilding(-40, -40, 25, 25, 80);
      createCommercialBuilding(40, -40, 25, 25, 60);
      createCommercialBuilding(40, 40, 25, 25, 90);
      createCommercialBuilding(-40, 40, 25, 25, 50);

      for (let x = -160; x <= 160; x += 40) {
        if (Math.abs(x) < 30) continue;
        createHouse(x, -120); createHouse(x, 120);
      }
      for (let z = -120; z <= 120; z += 40) {
        if (Math.abs(z) < 30) continue;
        createHouse(-160, z); createHouse(160, z);
      }

      for (let i = 0; i < 60; i++) {
        let px = (Math.random() - 0.5) * 400;
        let pz = (Math.random() - 0.5) * 400;
        if (Math.abs(px) < 20 || Math.abs(pz) < 20) continue;
        let isSafe = true;
        for (let j = 0; j < colliders.length; j++) {
          const c = colliders[j];
          if (px > c.x - c.halfWidth - 5 && px < c.x + c.halfWidth + 5 && pz > c.z - c.halfDepth - 5 && pz < c.z + c.halfDepth + 5) {
            isSafe = false; break;
          }
        }
        if (isSafe) createPalmTree(px, pz);
      }
    }

    // ==========================================
    // CRIAÇÃO DO PERSONAGEM
    // ==========================================
    function createPlayerCharacter(config) {
      const group = new THREE.Group();
      
      const skinC = config.skinColor || "#e0ac8c";
      const shirtC = config.shirtColor || "#3498db";
      const pantsC = config.pantsColor || "#2c3e50";

      const matSkin = new THREE.MeshStandardMaterial({ color: skinC, roughness: 0.6 });
      const matShirt = new THREE.MeshStandardMaterial({ color: shirtC, roughness: 0.8 });
      const matPants = new THREE.MeshStandardMaterial({ color: pantsC, roughness: 0.9 });
      const matShoe = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
      const matHair = new THREE.MeshStandardMaterial({ color: 0x2a1b14, roughness: 0.9 });

      const hips = new THREE.Group();
      hips.position.y = 0.95;
      group.add(hips);

      const hipsMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), matPants);
      hipsMesh.castShadow = true; hips.add(hipsMesh);

      const spine = new THREE.Group();
      spine.position.y = 0.1; hips.add(spine);

      const chestMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.25, 8, 16), matShirt);
      chestMesh.position.y = 0.25; chestMesh.castShadow = true; spine.add(chestMesh);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.12), matSkin);
      neck.position.y = 0.52; neck.castShadow = true; spine.add(neck);

      const headGroup = new THREE.Group();
      headGroup.position.y = 0.70; spine.add(headGroup);

      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), matSkin);
      headMesh.scale.set(0.9, 1.1, 0.95); headMesh.castShadow = true; headGroup.add(headMesh);

      const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.145, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), matHair);
      hairMesh.position.y = 0.02; hairMesh.castShadow = true; headGroup.add(hairMesh);

      function createArm(side) {
        const armGroup = new THREE.Group();
        armGroup.position.set(side * 0.28, 0.4, 0); spine.add(armGroup);
        const upperArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.2, 4, 8), matShirt);
        upperArm.position.y = -0.15; upperArm.castShadow = true; armGroup.add(upperArm);
        const elbow = new THREE.Group(); elbow.position.y = -0.3; armGroup.add(elbow);
        const foreArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.2, 4, 8), matSkin);
        foreArm.position.y = -0.12; foreArm.castShadow = true; elbow.add(foreArm);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), matSkin);
        hand.position.y = -0.25; hand.castShadow = true; elbow.add(hand);
        return armGroup;
      }
      const armL = createArm(1); const armR = createArm(-1);

      function createLeg(side) {
        const legGroup = new THREE.Group();
        legGroup.position.set(side * 0.12, -0.05, 0); hips.add(legGroup);
        const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.25, 4, 8), matPants);
        thigh.position.y = -0.15; thigh.castShadow = true; legGroup.add(thigh);
        const knee = new THREE.Group(); knee.position.y = -0.35; legGroup.add(knee);
        const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.25, 4, 8), matPants);
        shin.position.y = -0.15; shin.castShadow = true; knee.add(shin);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.22), matShoe);
        foot.position.set(0, -0.33, 0.05); foot.castShadow = true; knee.add(foot);
        legGroup.userData = { knee: knee };
        return legGroup;
      }
      const legL = createLeg(1); const legR = createLeg(-1);

      group.userData = { hips, spine, legL, legR, armL, armR };
      return group;
    }
