<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luanda Vice - Login</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Poppins:wght@300;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #05080f;
      width: 100vw;
      height: 100vh;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* ==========================================
       FORÇAR MODO PAISAGEM (ROTAÇÃO VIA CSS)
    ========================================== */
    #app-container {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 100vh;
      transform: translate(-50%, -50%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (orientation: portrait) {
      #app-container {
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
      
      /* Contra-rotação para o canvas 3D não ficar deitado */
      #preview-canvas-container {
        transform: rotate(-90deg);
        transform-origin: center center;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 50%;
        left: 50%;
        margin-top: -50vw;
        margin-left: -50vh;
      }
    }

    /* Fundo Animado */
    .bg-effect {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(0, 255, 204, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 50%, rgba(0, 119, 255, 0.15) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    /* ==========================================
       TELA DE PROCESSAMENTO
    ========================================== */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #05080f;
      transition: opacity 0.8s ease;
    }

    .logo-container {
      position: relative;
      margin-bottom: 40px;
      text-align: center;
    }

    .logo-loading {
      font-family: 'Rajdhani', sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 12px;
      background: -webkit-linear-gradient(45deg, #00ffcc, #0077ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulseLogo 2s infinite alternate;
    }

    .logo-subtitle {
      font-size: 12px;
      color: #8892b0;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: -10px;
    }

    @keyframes pulseLogo {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0,255,204,0.5)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 40px rgba(0,255,204,0.9)); }
    }

    .loading-bar-wrapper {
      position: relative;
      width: 60%;
      max-width: 600px;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ffcc, #0077ff);
      box-shadow: 0 0 20px #00ffcc;
      transition: width 0.2s linear;
    }

    .loading-bar-glow {
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      animation: glowMove 1.5s infinite;
    }

    @keyframes glowMove {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .loading-info {
      display: flex;
      justify-content: space-between;
      width: 60%;
      max-width: 600px;
      font-family: monospace;
      font-size: 14px;
      color: #00ffcc;
      margin-bottom: 40px;
    }

    .loading-tip {
      font-size: 16px;
      color: #8892b0;
      font-style: italic;
      letter-spacing: 1px;
      animation: fadeText 0.5s ease;
    }

    @keyframes fadeText {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       TELA DE LOGIN
    ========================================== */
    #login-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #login-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    .logo-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 6px;
      background: -webkit-linear-gradient(45deg, #ffffff, #8892b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #00ffcc;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 60px;
      font-weight: 600;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 18px 50px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-transform: uppercase;
    }

    .google-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #00ffcc;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
      transform: translateY(-3px);
    }

    .google-btn svg { width: 28px; height: 28px; fill: currentColor; }

    .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    #error-msg {
      position: absolute;
      bottom: 50px;
      color: #ff3c3c;
      font-size: 14px;
      background: rgba(255, 60, 60, 0.1);
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 60, 60, 0.3);
      display: none;
      backdrop-filter: blur(5px);
    }

    /* ==========================================
       TELA DE CONFIGURAÇÃO
    ========================================== */
    #config-screen {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #config-screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Área do 3D (Esquerda) */
    .preview-panel {
      flex: 1.2;
      position: relative;
      background: radial-gradient(circle, rgba(0, 255, 204, 0.05) 0%, transparent 60%);
      overflow: hidden;
    }

    #preview-canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    /* Painel de Customização (Direita) */
    .config-panel {
      flex: 1;
      max-width: 500px;
      background: rgba(10, 15, 25, 0.95);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.05);
      padding: 20px;
      display: flex;
      flex-direction: column;
      z-index: 2;
      box-shadow: -20px 0 50px rgba(0,0,0,0.8);
      overflow-y: auto;
      height: 100%;
    }

    .config-panel::-webkit-scrollbar { width: 6px; }
    .config-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .config-panel::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 4px; }

    .config-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      letter-spacing: 2px;
      border-bottom: 2px solid #00ffcc;
      padding-bottom: 5px;
      display: inline-block;
      flex-shrink: 0;
    }

    .input-group { margin-bottom: 12px; flex-shrink: 0; }

    .input-group label {
      display: block;
      font-size: 11px;
      color: #00ffcc;
      margin-bottom: 5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Rajdhani', sans-serif;
    }

    .input-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus { 
      border-color: #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
    }

    .color-options { display: flex; gap: 8px; flex-wrap: wrap; }

    .color-btn {
      width: 35px;
      height: 35px;
      border-radius: 6px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .color-btn:hover { transform: translateY(-3px) scale(1.05); }
    
    .color-btn.selected {
      border-color: #00ffcc;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
      transform: scale(1.1);
    }

    /* BOTÃO JOGAR NO TOPO */
    .play-btn {
      background: linear-gradient(90deg, #00ffcc, #0077ff);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Rajdhani', sans-serif;
      cursor: pointer;
      margin-bottom: 15px;
      letter-spacing: 2px;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
    }

  </style>
</head>
<body>

  <!-- O container principal já rotaciona automaticamente -->
  <div id="app-container">
    <div class="bg-effect"></div>

    <!-- ==========================================
         TELA 0: PROCESSAMENTO
    ========================================== -->
    <div id="loading-screen">
      <div class="logo-container">
        <div class="logo-loading">LUANDA VICE</div>
        <div class="logo-subtitle">OPEN WORLD MULTIPLAYER</div>
      </div>
      
      <div class="loading-bar-wrapper">
        <div class="loading-bar-fill" id="loading-bar"></div>
        <div class="loading-bar-glow"></div>
      </div>
      
      <div class="loading-info">
        <span id="loading-percent">0%</span>
        <span id="loading-status">CARREGANDO TEXTURAS...</span>
      </div>

      <div class="loading-tip" id="loading-tip">Iniciando conexão...</div>
    </div>

    <!-- ==========================================
         TELA 1: LOGIN
    ========================================== -->
    <div id="login-screen">
      <div class="logo-title">LUANDA VICE</div>
      <div class="subtitle">O jogo começa aqui</div>
      
      <button id="google-login-btn" class="google-btn">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span id="btn-text">Entrar com Google</span>
        <div id="btn-spinner" class="spinner"></div>
      </button>

      <div id="error-msg">Erro ao conectar. Tente novamente.</div>
    </div>

    <!-- ==========================================
         TELA 2: CONFIGURAÇÃO
    ========================================== -->
    <div id="config-screen">
      
      <!-- Preview 3D -->
      <div class="preview-panel">
        <div id="preview-canvas-container"></div>
      </div>

      <!-- Painel de Controles -->
      <div class="config-panel">
        
        <!-- BOTÃO JOGAR NO TOPO -->
        <button id="start-game-btn" class="play-btn">JOGAR AGORA</button>

        <div class="config-title">CRIAÇÃO</div>
        
        <div class="input-group">
          <label>Nick de Jogador</label>
          <input type="text" id="input-nick" value="Jogador_01" maxlength="15">
        </div>

        <div class="input-group">
          <label>Tom de Pele</label>
          <div class="color-options" id="skin-options">
            <div class="color-btn selected" data-color="#e0ac8c" style="background: #e0ac8c;"></div>
            <div class="color-btn" data-color="#c68642" style="background: #c68642;"></div>
            <div class="color-btn" data-color="#8d5524" style="background: #8d5524;"></div>
            <div class="color-btn" data-color="#4a2c1b" style="background: #4a2c1b;"></div>
          </div>
        </div>

        <div class="input-group">
          <label>Cor da Camisa</label>
          <div class="color-options" id="shirt-options">
            <div class="color-btn selected" data-color="#3498db" style="background: #3498db;"></div>
            <div class="color-btn" data-color="#e74c3c" style="background: #e74c3c;"></div>
            <div class="color-btn" data-color="#2ecc71" style="background: #2ecc71;"></div>
            <div class="color-btn" data-color="#9b59b6" style="background: #9b59b6;"></div>
            <div class="color-btn" data-color="#f1c40f" style="background: #f1c40f;"></div>
          </div>
        </div>

        <div class="input-group">
          <label>Cor da Calça</label>
          <div class="color-options" id="pants-options">
            <div class="color-btn selected" data-color="#2c3e50" style="background: #2c3e50;"></div>
            <div class="color-btn" data-color="#1a1a1a" style="background: #1a1a1a;"></div>
            <div class="color-btn" data-color="#5c4033" style="background: #5c4033;"></div>
            <div class="color-btn" data-color="#2980b9" style="background: #2980b9;"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    // ==========================================
    // CONFIGURAÇÃO FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDgSaXJZFNpiJW3DDXW5P_efRkeI0ef_so",
      authDomain: "luanda-vice.firebaseapp.com",
      projectId: "luanda-vice",
      storageBucket: "luanda-vice.firebasestorage.app",
      messagingSenderId: "446864906061",
      appId: "1:446864906061:web:634c5c1fc14c99d04ec904",
      databaseURL: "https://luanda-vice-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // ==========================================
    // SISTEMA DE LOADING
    // ==========================================
    const loadingScreen = document.getElementById('loading-screen');
    const loginScreen = document.getElementById('login-screen');
    const loadingBar = document.getElementById('loading-bar');
    const loadingPercent = document.getElementById('loading-percent');
    const loadingStatus = document.getElementById('loading-status');
    const loadingTip = document.getElementById('loading-tip');

    const tips = [
      "Dica: Explore a cidade para encontrar itens raros.",
      "Dica: Segure o botão de correr para fugir mais rápido.",
      "Dica: Personalize seu personagem para se destacar.",
      "Dica: O multiplayer está ativo. Encontre outros jogadores!",
      "Dica: Use o pulo para atravessar obstáculos."
    ];

    const statuses = [
      "CARREGANDO TEXTURAS...",
      "CONECTANDO AO SERVIDOR...",
      "CRIANDO O MUNDO...",
      "CARREGANDO MODELOS 3D...",
      "PRONTO!"
    ];

    let progress = 0;
    let tipIndex = 0;
    let statusIndex = 0;

    const tipInterval = setInterval(() => {
      tipIndex = (tipIndex + 1) % tips.length;
      loadingTip.innerText = tips[tipIndex];
    }, 2000);

    const loadInterval = setInterval(() => {
      progress += Math.random() * 15;
      if (progress > 100) progress = 100;
      
      loadingBar.style.width = `${progress}%`;
      loadingPercent.innerText = `${Math.floor(progress)}%`;

      if (progress > 20 && statusIndex === 0) { statusIndex = 1; loadingStatus.innerText = statuses[1]; }
      if (progress > 50 && statusIndex === 1) { statusIndex = 2; loadingStatus.innerText = statuses[2]; }
      if (progress > 80 && statusIndex === 2) { statusIndex = 3; loadingStatus.innerText = statuses[3]; }

      if (progress === 100) {
        loadingStatus.innerText = statuses[4];
        clearInterval(loadInterval);
        clearInterval(tipInterval);
        
        setTimeout(() => {
          loadingScreen.style.opacity = "0";
          setTimeout(() => {
            loadingScreen.style.display = "none";
            loginScreen.classList.add('active');
          }, 800);
        }, 800);
      }
    }, 200);

    // ==========================================
    // LÓGICA DE LOGIN E VERIFICAÇÃO DE USUÁRIO
    // ==========================================
    const googleBtn = document.getElementById('google-login-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorMsg = document.getElementById('error-msg');
    const inputNick = document.getElementById('input-nick');
    const configScreen = document.getElementById('config-screen');
    
    let currentUser = null;

    googleBtn.addEventListener('click', () => {
      btnText.innerText = "Autenticando...";
      btnSpinner.style.display = "block";
      googleBtn.disabled = true;
      errorMsg.style.display = "none";

      signInWithPopup(auth, provider).catch((error) => {
        console.error(error);
        btnText.innerText = "Entrar com Google";
        btnSpinner.style.display = "none";
        googleBtn.disabled = false;
        errorMsg.style.display = "block";
        errorMsg.innerText = "Erro: " + error.message;
      });
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        loginScreen.classList.remove('active');
        
        // VERIFICA SE O USUÁRIO JÁ EXISTE NO BANCO
        const userRef = ref(db, 'players/' + user.uid);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          // Usuário já existe! Pega os dados e manda direto pro jogo
          const existingData = snapshot.val();
          localStorage.setItem('luandaVice_PlayerConfig', JSON.stringify(existingData));
          
          // Tela de loading de boas-vindas
          loadingScreen.style.display = "flex";
          loadingScreen.style.opacity = "1";
          document.querySelector('.logo-loading').innerText = "BEM-VINDO DE VOLTA";
          document.querySelector('.logo-subtitle').innerText = existingData.nick.toUpperCase();
          document.querySelector('.loading-info').style.display = 'none';
          document.querySelector('.loading-bar-wrapper').style.display = 'none';
          loadingTip.innerText = "Carregando seu personagem...";
          
          setTimeout(() => {
            window.location.href = 'jogo.html';
          }, 2000);

        } else {
          // Usuário novo! Mostra a tela de criação de personagem
          setTimeout(() => {
            configScreen.classList.add('active');
            
            setTimeout(() => {
              init3DPreview();
              setupColorPickers(); 
            }, 300);

            if (user.displayName) {
              inputNick.value = user.displayName.replace(/\s+/g, '_').substring(0, 15);
            }
          }, 500);
        }
      }
    });

    // ==========================================
    // PREVIEW 3D
    // ==========================================
    let scene, camera, renderer, playerModel;
    let matSkin, matShirt, matPants;
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let previewInitialized = false;

    const currentColors = { skin: "#e0ac8c", shirt: "#3498db", pants: "#2c3e50" };

    function init3DPreview() {
      if (previewInitialized) return;
      previewInitialized = true;

      const container = document.getElementById('preview-canvas-container');
      
      // Pega o tamanho real considerando a rotação do CSS
      let width = container.clientWidth;
      let height = container.clientHeight;
      
      if (window.innerHeight > window.innerWidth) {
        width = container.clientWidth;
        height = container.clientHeight;
      }

      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(0, 1.0, 4.5);
      camera.lookAt(0, 0.9, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
      keyLight.position.set(2, 3, 2);
      keyLight.castShadow = true;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x00ffcc, 1.0);
      fillLight.position.set(-2, 1, 2);
      scene.add(fillLight);

      matSkin = new THREE.MeshStandardMaterial({ color: currentColors.skin, roughness: 0.5 });
      matShirt = new THREE.MeshStandardMaterial({ color: currentColors.shirt, roughness: 0.7 });
      matPants = new THREE.MeshStandardMaterial({ color: currentColors.pants, roughness: 0.9 });
      const matShoe = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
      const matHair = new THREE.MeshStandardMaterial({ color: 0x2a1b14, roughness: 0.9 });

      playerModel = new THREE.Group();
      scene.add(playerModel);

      const hips = new THREE.Group();
      hips.position.y = 0.95;
      playerModel.add(hips);

      const hipsMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.2), matPants);
      hipsMesh.castShadow = true;
      hips.add(hipsMesh);

      const spine = new THREE.Group();
      spine.position.y = 0.1;
      hips.add(spine);

      const chestMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.25, 8, 16), matShirt);
      chestMesh.position.y = 0.25;
      chestMesh.castShadow = true;
      spine.add(chestMesh);

      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.12), matSkin);
      neck.position.y = 0.52;
      neck.castShadow = true;
      spine.add(neck);

      const headGroup = new THREE.Group();
      headGroup.position.y = 0.70;
      spine.add(headGroup);

      const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), matSkin);
      headMesh.scale.set(0.9, 1.1, 0.95);
      headMesh.castShadow = true;
      headGroup.add(headMesh);

      const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.145, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6), matHair);
      hairMesh.position.y = 0.02;
      hairMesh.castShadow = true;
      headGroup.add(hairMesh);

      function createArm(side) {
        const armGroup = new THREE.Group();
        armGroup.position.set(side * 0.28, 0.4, 0);
        spine.add(armGroup);
        const upperArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.2, 4, 8), matShirt);
        upperArm.position.y = -0.15;
        upperArm.castShadow = true;
        armGroup.add(upperArm);
        const elbow = new THREE.Group();
        elbow.position.y = -0.3;
        armGroup.add(elbow);
        const foreArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.2, 4, 8), matSkin);
        foreArm.position.y = -0.12;
        foreArm.castShadow = true;
        elbow.add(foreArm);
        const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), matSkin);
        hand.position.y = -0.25;
        hand.castShadow = true;
        elbow.add(hand);
      }
      createArm(1);
      createArm(-1);

      function createLeg(side) {
        const legGroup = new THREE.Group();
        legGroup.position.set(side * 0.12, -0.05, 0);
        hips.add(legGroup);
        const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.08, 0.25, 4, 8), matPants);
        thigh.position.y = -0.15;
        thigh.castShadow = true;
        legGroup.add(thigh);
        const knee = new THREE.Group();
        knee.position.y = -0.35;
        legGroup.add(knee);
        const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.25, 4, 8), matPants);
        shin.position.y = -0.15;
        shin.castShadow = true;
        knee.add(shin);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.22), matShoe);
        foot.position.set(0, -0.33, 0.05);
        foot.castShadow = true;
        knee.add(foot);
      }
      createLeg(1);
      createLeg(-1);

      const floorGeo = new THREE.CircleGeometry(1.5, 32);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x0a0f1a, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.01;
      floor.receiveShadow = true;
      scene.add(floor);

      container.addEventListener('pointerdown', (e) => {
        isDragging = true;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });
      window.addEventListener('pointerup', () => isDragging = false);
      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        
        let deltaX = e.clientX - previousMousePosition.x;
        if (window.innerHeight > window.innerWidth) {
          deltaX = e.clientY - previousMousePosition.y;
        }
        
        playerModel.rotation.y += deltaX * 0.01;
        previousMousePosition = { x: e.clientX, y: e.clientY };
      });

      const clock = new THREE.Clock();
      function animatePreview() {
        requestAnimationFrame(animatePreview);
        const t = clock.getElapsedTime();
        
        playerModel.position.y = Math.sin(t * 2) * 0.02;
        if (!isDragging) {
          playerModel.rotation.y += 0.005;
        }

        renderer.render(scene, camera);
      }
      animatePreview();

      window.addEventListener('resize', () => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });
    }

    // ==========================================
    // CORES EM TEMPO REAL
    // ==========================================
    function setupColorPickers() {
      function setup(containerId, configKey, material) {
        const container = document.getElementById(containerId);
        const buttons = container.querySelectorAll('.color-btn');
        
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            buttons.forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            
            const hexColor = btn.getAttribute('data-color');
            currentColors[configKey] = hexColor;
            
            if (material) {
              material.color.set(hexColor);
            }
          });
        });
      }

      setup('skin-options', 'skin', matSkin);
      setup('shirt-options', 'shirt', matShirt);
      setup('pants-options', 'pants', matPants);
    }

    // ==========================================
    // SALVAR NO BANCO E JOGAR
    // ==========================================
    document.getElementById('start-game-btn').addEventListener('click', () => {
      if (!currentUser) return;

      const nick = inputNick.value.trim() || "Jogador";
      const btn = document.getElementById('start-game-btn');
      
      btn.innerText = "SALVANDO...";
      btn.disabled = true;
      btn.style.background = "#fff";

      const playerData = {
        uid: currentUser.uid,
        nick: nick,
        skinColor: currentColors.skin,
        shirtColor: currentColors.shirt,
        pantsColor: currentColors.pants,
        isOnline: true,
        lastLogin: Date.now()
      };

      set(ref(db, 'players/' + currentUser.uid), playerData)
        .then(() => {
          localStorage.setItem('luandaVice_PlayerConfig', JSON.stringify(playerData));
          
          btn.innerText = "ENTRANDO...";
          setTimeout(() => {
            window.location.href = 'jogo.html'; 
          }, 800);
        })
        .catch((error) => {
          console.error("Erro ao salvar no banco:", error);
          alert("Erro ao salvar no banco de dados. Verifique as regras do Firebase.");
          btn.innerText = "TENTAR NOVAMENTE";
          btn.disabled = false;
          btn.style.background = "";
        });
    });
  </script>
</body>
</html>
